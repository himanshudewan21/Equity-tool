services:
  - type: web
    name: equity-tool
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --timeout 120 --bind 0.0.0.0:$PORT web.app:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
